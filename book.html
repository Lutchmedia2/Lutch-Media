hq:"How long are we shooting?",hr:"hrs",hn:"Coffee breaks are free. Oat milk debates are not timed.",hs:"Shoot time",inc:"Included",hrly:"/hr",

hq:"Konbien letan nou pou filme?",hr:"er",hn:"Pose kafe gratis. Debat lalet avwan pa ganny konte.",hs:"Letan shoot",inc:"Inkli",hrly:"/er",

let lang='en',st={type:'film',fmt:'land',light:'no',hrs:4,edit:'none',grade:'none',drone:'no',orient:'land',plight:'no',retouch:'none',usage:'web',term:'12',pay:'full'};
const L=()=>lang==='en'?0:1,GBP=n=>new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP',maximumFractionDigits:0}).format(n);
const opt=(g,id)=>g.o.find(o=>o.id===id),price=o=>o.ph?o.ph*st.hrs:(o.p||0);
function calc(){
  const t=T[lang],k=L(),rows=[{l:`${t.hs} · ${st.hrs} ${t.hr}`,v:st.hrs*RATE[st.type]}];
  steps().filter(g=>g.o&&g.k!=='type').forEach(g=>{const o=opt(g,st[g.k]);rows.push({l:`${g.s[k]}: ${o.t[k]}${o.ph?` · ${st.hrs} ${t.hr}`:''}`,v:price(o)})});
  const sub=rows.reduce((a,r)=>a+r.v,0),vat=Math.round(sub*VAT),total=sub+vat;
  return{rows,sub,vat,total,due:st.pay==='dep'?Math.round(total/2):total};

  const t=T[lang],k=L(),el=document.getElementById('steps');let n=0;
  el.innerHTML=steps().map(g=>{n++;const num=String(n).padStart(2,'0');
    if(g.k==='hrs')return `<section class="step"><span class="tiny">${num}</span><h2>${t.hq}</h2><div class="hours"><b id="hv">${st.hrs}</b><span>${t.hr}</span></div><input type="range" id="hr" min="1" max="12" value="${st.hrs}" aria-label="${t.hq}"><div class="ticks"><span>1</span><span>3</span><span>6</span><span>9</span><span>12</span></div><p class="note">${t.hn}</p></section>`;
    return `<section class="step"><span class="tiny">${num}</span><h2>${g.q[k]}</h2><div class="opts" role="radiogroup" aria-label="${g.q[k]}">`+g.o.map(o=>`<button type="button" class="opt" role="radio" data-k="${g.k}" data-id="${o.id}" aria-checked="${st[g.k]===o.id}"><b>${o.t[k]}<i>${g.k==='type'?'':o.ph?GBP(o.ph)+t.hrly:o.p?'+'+GBP(o.p):t.inc}</i></b><span>${o.d[k]}</span></button>`).join('')+`</div></section>`}).join('')+
  `<section class="step" id="book"><span class="tiny">${String(n+1).padStart(2,'0')}</span><h2>${t.bk}</h2><p class="note" style="margin:-8px 0 22px">${t.bj}</p>
  <div class="form"><label>${t.n}<input id="fn" autocomplete="name"></label><label>${t.e}<input id="fe" type="email" autocomplete="email"></label><label>${t.p}<input id="fp"></label><label>${t.d}<input id="fd" type="date"></label><label class="full">${t.x}<textarea id="fx" rows="3"></textarea></label></div>
  <div class="opts" role="radiogroup" aria-label="Payment" style="margin-bottom:22px"><button type="button" class="opt" role="radio" data-k="pay" data-id="full" aria-checked="${st.pay==='full'}"><b>${t.full}</b></button><button type="button" class="opt" role="radio" data-k="pay" data-id="dep" aria-checked="${st.pay==='dep'}"><b>${t.dep}</b><span>${t.depn}</span></button></div>
  <div class="recap"><div id="recap"></div><div class="tot"><span>${t.today}</span><b id="due"></b></div></div>
  <div class="pays"><button class="btn" id="pc">${t.card}</button><button class="btn apay" id="pa"> ${t.apple}</button></div>
  <div class="err" id="err" role="alert"></div><div class="notice" id="notice"><span>${t.nt}</span><br><a class="btn ghost" id="mail" href="#">${t.em}</a></div><p class="fine">${t.fine}${st.type==='photo'?' '+t.lic:''}</p></section>`;
  el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{st[b.dataset.k]=b.dataset.id;el.querySelectorAll(`[data-k="${b.dataset.k}"]`).forEach(x=>x.setAttribute('aria-checked',x===b));if(b.dataset.k==='type'){rebuild();document.querySelector('[data-k="type"][aria-checked="true"]').focus()}else update()});
  const r=document.getElementById('hr');r.oninput=()=>{st.hrs=+r.value;document.getElementById('hv').textContent=st.hrs;update()};
  document.getElementById('pc').onclick=()=>pay('card');document.getElementById('pa').onclick=()=>pay('apple');
}
function rebuild(){const ids=['fn','fe','fp','fd','fx'],keep=ids.map(i=>{const e=document.getElementById(i);return e?e.value:''});build();ids.forEach((i,j)=>document.getElementById(i).value=keep[j]);update()}
function pay(method){
  const t=T[lang],n=document.getElementById('fn').value.trim(),e=document.getElementById('fe').value.trim(),err=document.getElementById('err'),nt=document.getElementById('notice');
  nt.classList.remove('on');
  if(!n||!/^\S+@\S+\.\S+$/.test(e)){err.textContent=t.er;document.getElementById(n?'fe':'fn').focus();return}
  err.textContent='';
  const c=calc(),k=L(),sum=`Project: ${opt(TYPE,st.type).t[0]}\n`+c.rows.map(r=>`${r.l}: ${r.v?GBP(r.v):'Included'}`).join('\n')+`\nSubtotal: ${GBP(c.sub)}\nVAT: ${GBP(c.vat)}\nTotal: ${GBP(c.total)}\nDue today: ${GBP(c.due)} (${st.pay==='dep'?'50% deposit':'full'})`;
  if(CHECKOUT_URL){location.href=CHECKOUT_URL+'?'+new URLSearchParams({amount:c.due*100,method,name:n,email:e,summary:sum});return}
  const body=`Hi Lutch,\n\nName: ${n}\nEmail: ${e}\nProject: ${document.getElementById('fp').value}\nPreferred date: ${document.getElementById('fd').value}\nNotes: ${document.getElementById('fx').value}\nPreferred payment: ${method}\n\n${sum}`;
  document.getElementById('mail').href='mailto:hello@lutchmedia.com?subject='+encodeURIComponent('Shoot booking: '+n)+'&body='+encodeURIComponent(body);
  nt.classList.add('on');nt.scrollIntoView({block:'center',behavior:'smooth'});
}
const nodes=document.querySelectorAll('[data-i]'),btns=document.querySelectorAll('.lang button');
function setLang(l){
  const keep=['fn','fe','fp','fd','fx'].map(i=>{const e=document.getElementById(i);return e?e.value:''});
  lang=l;nodes.forEach(n=>{if(T[l][n.dataset.i]!==undefined)n.innerHTML=T[l][n.dataset.i]});
  document.documentElement.lang=l;btns.forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===l));
  build();['fn','fe','fp','fd','fx'].forEach((i,j)=>document.getElementById(i).value=keep[j]);update();
  try{localStorage.setItem('lutch-lang',l)}catch(e){}}
btns.forEach(b=>b.onclick=()=>setLang(b.dataset.l));
let s0='en';try{s0=localStorage.getItem('lutch-lang')||'en'}catch(e){}
setLang(T[s0]?s0:'en');
</script>
</body>
